# SPDX-License-Identifier: Apache-2.0
#
# cargo-deny policy for Lens (maintainer-approved, 20 November 2026).
# CI checks the default reference-only graph and the `--all-features` graph,
# which adds the optional `qwen3` model backend, so a feature-gated
# dependency is never outside the audited surface.
#
# The license list follows the Munarium Server policy: permissive licenses
# compatible with distributing Lens under Apache-2.0. Add a license only
# after reviewing the crate that needs it, and say why here.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
# One list serves both graphs, so an entry unused by one graph is expected.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# Lens itself is first-party; scripts/check_repository.py checks its headers.
[[licenses.exceptions]]
name = "munarium-lens"
allow = ["Apache-2.0"]

# webpki-roots is Mozilla's CA root list compiled in as data, under the
# permissive CDLA-Permissive-2.0 data license. Only the optional `fetch`
# graph has it. Approved by the maintainer on 20 November 2026 (see
# [bans]). The exception is scoped to this one crate rather than added to
# `allow`.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
# The advisory database is fetched at check time. Every RustSec advisory,
# including unmaintained and unsound notices, fails the check. An exception
# needs a reasoned entry in `ignore` with its revisit condition.
yanked = "deny"
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436). APPROVED by the maintainer
    # on 20 November 2026.
    #
    # Where: only in the optional `qwen3` graph, as a compile-time proc-macro
    # reached only through Candle's matrix-multiply crates (gemm 0.19.0, the
    # latest release, and its gemm-* siblings), which use it for identifier
    # concatenation (`cargo tree -i paste --features qwen3`). It is absent
    # from the default reference-only graph, build and image.
    #
    # Why accepted: an UNMAINTAINED-crate advisory, not a vulnerability. It
    # runs only inside the compiler at build time and is not linked into the
    # binary as runtime code, so it parses no request data. There is no fixed
    # release and no maintained alternative Lens could choose, because the
    # latest gemm still depends on it.
    #
    # Re-evaluate when: any vulnerability advisory lands against paste
    # (blocking), or gemm or Candle drop it (take that release). Lens must
    # not use paste directly.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No OpenSSL or platform TLS: the static musl image must not link them.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # The tokenizer must stay pure Rust for the static image. These arrive
    # with the `tokenizers` `onig`, `esaxx_fast` and `http` features.
    { crate = "onig" },
    { crate = "onig_sys" },
    { crate = "hf-hub" },
    # No other HTTP client, and not the C-based aws-lc crypto provider.
    { crate = "reqwest" },
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    # Model bundle download: the ONE exception to "no HTTP client or TLS".
    #
    # Maintainer decision, 20 November 2026: Lens may download model bundles,
    # because baking weights into the image would make it far too large. The
    # allowance covers only the fixed Hugging Face repository
    # https://huggingface.co/iokaio/munarium-lens-models and the fixed backup
    # https://github.com/iokaio/munarium-lens/releases/download/ (tags
    # `models/<bundle>`), tried in that fixed order, with redirects only to
    # those two services' download hosts (src/fetch.rs). Neither base URL nor
    # the order is configurable, and Lens fetches from no other host for any
    # reason. A standard HTTPS_PROXY egress proxy is only a CONNECT route to
    # those same hosts, through ureq's built-in proxy support (no new crate).
    #
    # Each crate is allowed only through its expected parent, and only in the
    # optional `fetch` feature graph; the default build has none of them.
    # These exceptions are approved by the maintainer (20 November 2026).
    # ureq 3.5.2 with default features off and `rustls`: rustls 0.23 on the
    # ring provider with the compiled-in webpki-roots trust store.
    { crate = "ureq", wrappers = ["munarium-lens"] },
    { crate = "ureq-proto", wrappers = ["ureq"] },
    { crate = "rustls", wrappers = ["ureq"] },
    { crate = "rustls-webpki", wrappers = ["rustls"] },
    { crate = "webpki-roots", wrappers = ["ureq"] },
    { crate = "ring", wrappers = ["rustls", "rustls-webpki"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
