# SPDX-License-Identifier: Apache-2.0
#
# cargo-deny policy for Lens (maintainer-approved, 20 November 2026).
# CI checks the default reference-only graph and the `--all-features` graph,
# which adds the optional `qwen3` model backend, so a feature-gated
# dependency is never outside the audited surface.
#
# The license list follows the Munarium Server policy: permissive licenses
# compatible with distributing Lens under Apache-2.0. Add a license only
# after reviewing the crate that needs it, and say why here.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
# One list serves both graphs, so an entry unused by one graph is expected.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# Lens itself is first-party; scripts/check_repository.py checks its headers.
[[licenses.exceptions]]
name = "munarium-lens"
allow = ["Apache-2.0"]

[advisories]
# The advisory database is fetched at check time. Every RustSec advisory,
# including unmaintained and unsound notices, fails the check. An exception
# needs a reasoned entry in `ignore` with its revisit condition.
yanked = "deny"
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436), with no fixed release. It is
    # only in the optional `qwen3` graph: Candle's matrix-multiply crates
    # (gemm 0.19.0, the latest release, and its gemm-* siblings) use it as a
    # proc-macro for identifier concatenation (`cargo tree -i paste
    # --features qwen3`). It runs inside the compiler at build time and
    # contributes no runtime code, parses no request data and is absent from
    # the default reference-only build and image.
    #
    # An UNMAINTAINED advisory, not a vulnerability. Proposed with the
    # `qwen3` feature on 20 November 2026; pending maintainer acceptance.
    #
    # Re-evaluate when: gemm or Candle replace paste (take that release),
    # Lens uses paste directly, or any vulnerability advisory lands against
    # paste (blocking).
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No TLS or native crypto stacks: Lens has no outbound network client.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # The tokenizer must stay pure Rust for the static image. These arrive
    # with the `tokenizers` `onig`, `esaxx_fast` and `http` features.
    { crate = "onig" },
    { crate = "onig_sys" },
    { crate = "hf-hub" },
    # No runtime model downloads or HTTP clients in the graph.
    { crate = "reqwest" },
    { crate = "ureq" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
