[package]
name = "munarium-lens"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
description = "Munarium inference endpoint with a deterministic reference backend"
repository = "https://github.com/iokaio/munarium-lens"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.3", features = ["macros", "net", "rt", "signal", "sync", "time"] }

# Optional `qwen3` backend: pure-Rust CPU inference with Candle. Off by default
# so the reference build carries no ML dependencies.
candle-core = { version = "=0.11.1", default-features = false, optional = true }
candle-nn = { version = "=0.11.1", default-features = false, optional = true }
candle-transformers = { version = "=0.11.1", default-features = false, optional = true }
serde_json = { version = "=1.0.154", optional = true }
sha2 = { version = "=0.11.1", optional = true }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

# Optional `fetch` feature: download pinned model bundles from the two fixed
# Munarium locations (maintainer decision, 20 November 2026). A blocking
# HTTP/1.1 client on rustls with the ring provider and the compiled-in
# webpki-roots trust store; no OpenSSL, no compression, no JSON layer.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"], optional = true }

[features]
default = []
qwen3 = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:serde_json", "dep:sha2", "dep:tokenizers"]
fetch = ["dep:serde_json", "dep:sha2", "dep:ureq"]

[dev-dependencies]
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["io-util", "sync", "time"] }
